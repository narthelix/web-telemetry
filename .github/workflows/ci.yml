# Contract: handbook engineering/pipelines.md.
#
# Bu repo bir UYGULAMA degil, bir KUTUPHANE -- o yuzden narthelix/.github'daki
# `react-app-ci` reusable workflow'u kullanilmiyor: o build edip GHCR'a imaj
# basiyor, burada uretilen sey bir npm paketi.
#
# ---------------------------------------------------------------------------
# GITHUB-HOSTED RUNNER, self-hosted DEGIL -- ve bu bir tercih degil, bu repo
# public oldugu icin zorunlu (narthelix/muznara#918).
#
# Org'un runner grubu `allows_public_repositories: false` tasiyor, yani public
# bir repo o makineyi zaten alamaz: mevcut `[self-hosted, ...]` etiketiyle isler
# sonsuza kadar kuyrukta beklerdi. Ayar da dogru ayar -- fork'tan acilan bir PR
# `pull_request` icin workflow dosyasini PR'in kendi hâliyle kosturuyor, yani
# `runs-on`'u degistirebiliyor; kalici bir runner'da bu, bir kez zehirlenip
# sonraki isleri de kirletmek demek. O makine org'un geri kalan CI'ini da
# kosturuyor.
#
# Public repolarda GitHub-hosted runner ucretsiz; bu is de bir kutuphanenin
# build+test'i, ARM64'e bagli hicbir yani yok.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    # Yalnizca `v*` etiketiyle. Surum `package.json`'dan okunur; etiket onu
    # tetikler, degistirmez -- ikisi ayrisirsa npm zaten reddeder.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # GitHub Packages'a yazmak icin gereken tek yetki. Ayri bir PAT YOK:
      # `GITHUB_TOKEN` bu repo icin yeterli, ve org disina hicbir sey acmiyor.
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node bunu gorunce ~/.npmrc'yi yaziyor; elle .npmrc
          # commit'lemek gerekmiyor ve gerekmemeli (token oraya sizardi).
          registry-url: https://npm.pkg.github.com
          scope: "@narthelix"
      - run: npm ci --no-audit --no-fund
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-conventions:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: narthelix/.github/.github/workflows/pr-conventions.yml@main
    with:
      # Issue'lar narthelix/muznara'nin tracker'inda; dal adi numarayi tasiyor,
      # gövde onu kirik bir referans uretmeden baglayamaz.
      require_issue_link: false
      # ACIKCA hosted (narthelix/muznara#1026): bu repo PUBLIC, org'un runner
      # grubu public repolara bilerek kapali (#918) -- varsayilan self-hosted'a
      # dondugunde bu is sonsuza kadar kuyrukta beklerdi. Public repoda hosted
      # zaten ucretsiz.
      runner: ubuntu-latest

  secret-scan:
    permissions:
      contents: read
      pull-requests: read
    uses: narthelix/.github/.github/workflows/secret-scan.yml@main
    with:
      runner: ubuntu-latest  # gerekce yukaridaki pr-conventions cagrisinda (#1026)
