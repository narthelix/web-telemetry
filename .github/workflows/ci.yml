# Contract: handbook engineering/pipelines.md.
#
# Bu repo bir UYGULAMA degil, bir KUTUPHANE -- o yuzden narthelix/.github'daki
# `react-app-ci` reusable workflow'u kullanilmiyor: o build edip GHCR'a imaj
# basiyor, burada uretilen sey bir npm paketi.
#
# ---------------------------------------------------------------------------
# GITHUB-HOSTED RUNNER, self-hosted DEGIL -- ve bu bir tercih degil, bu repo
# public oldugu icin zorunlu (narthelix/muznara#918).
#
# Org'un runner grubu `allows_public_repositories: false` tasiyor, yani public
# bir repo o makineyi zaten alamaz: mevcut `[self-hosted, ...]` etiketiyle isler
# sonsuza kadar kuyrukta beklerdi. Ayar da dogru ayar -- fork'tan acilan bir PR
# `pull_request` icin workflow dosyasini PR'in kendi hâliyle kosturuyor, yani
# `runs-on`'u degistirebiliyor; kalici bir runner'da bu, bir kez zehirlenip
# sonraki isleri de kirletmek demek. O makine org'un geri kalan CI'ini da
# kosturuyor.
#
# Public repolarda GitHub-hosted runner ucretsiz; bu is de bir kutuphanenin
# build+test'i, ARM64'e bagli hicbir yani yok.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Coverage floor (narthelix/ops#2089 T15); `npm test` stays the developer\'s, floor-free.
      - run: npm run test:coverage
      # Changed-lines coverage on a PR: report only (narthelix/ops#2089 T15).
      - name: changed-lines coverage
        if: github.event_name == 'pull_request'
        uses: narthelix/ci-scripts/actions/diff-coverage@9217978ab1e4fe823be451f4ef7d5013d7d7ce5b  # v0.14.1
        with:
          report: coverage/lcov.info
      - run: npm run build
  publish:
    # Yalnizca `v*` etiketiyle. Surum `package.json`'dan okunur; etiket onu
    # tetikler, degistirmez -- ikisi ayrisirsa npm zaten reddeder.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # GitHub Packages'a yazmak icin gereken tek yetki. Ayri bir PAT YOK:
      # `GITHUB_TOKEN` bu repo icin yeterli, ve org disina hicbir sey acmiyor.
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node bunu gorunce ~/.npmrc'yi yaziyor; elle .npmrc
          # commit'lemek gerekmiyor ve gerekmemeli (token oraya sizardi).
          registry-url: https://npm.pkg.github.com
          scope: "@narthelix"
      - run: npm ci --no-audit --no-fund
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Org genelindeki dört kapı tek işte (narthelix/ops#2050): pr-conventions,
  # secret-scan, zizmor, repo-lint, sonra risk sınıfı. Kapı başına bir pod
  # yerine PR başına bir pod; zorunlu kontrol `gates / gate` (org ruleset).
  gates:
    permissions:
      contents: read
      pull-requests: write  # risk:* etiketi + reviewdog yorumları
    uses: narthelix/ci-scripts/.github/workflows/gates.yml@f83a93476b6f4efc792ccb86470ff6e11eb61bdf  # v0.12.0
    secrets:
      merger_private_key: ${{ secrets.MERGER_APP_PRIVATE_KEY }}
    with:
      # Runner etiketi cagiranda kalir: ci-scripts PUBLIC, varsayilan tasiyamaz (ADR-0099).
      runner: ubuntu-latest
      merger_client_id: ${{ vars.MERGER_CLIENT_ID }}
      require_issue_link: false
